<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fits Ideas Wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=Bricolage+Grotesque:wght@600;800&family=Space+Mono:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: teal header with counters, four play tabs, a wall of idea cards sorted by hearts, input fixed at the bottom on phones. */
:root{
  --bg:#FBF4E6; --card:#FFFDF7; --fg:#10202C; --muted:#5D6B72; --line:rgba(16,32,44,.16);
  --band:#3F6873; --band-fg:#FAEFD7; --accent:#E8823A; --on-accent:#10202C; --mint:#3AE2A2; --chip:#F2E6CC;
  --t-stand:#E8823A; --t-bf:#10202C; --t-leden:#3F6873; --t-open:#2BB07E;
  --display:"Archivo Black","Archivo",Arial,sans-serif;
  --head:"Bricolage Grotesque","Archivo",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1D24; --card:#16272F; --fg:#FAEFD7; --muted:#A9B6BB; --line:rgba(250,239,215,.16);
  --band:#16323B; --band-fg:#FAEFD7; --chip:#1F343D; --t-bf:#FAEFD7; --t-leden:#7FB3C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D24; --card:#16272F; --fg:#FAEFD7; --muted:#A9B6BB; --line:rgba(250,239,215,.16);
  --band:#16323B; --band-fg:#FAEFD7; --chip:#1F343D; --t-bf:#FAEFD7; --t-leden:#7FB3C0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-fg)}
header .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
h1{margin:8px 0 0;font:400 clamp(34px,7vw,64px)/.95 var(--display);text-transform:uppercase;text-wrap:balance}
.stats{display:flex;gap:24px}
.stats div{display:grid;gap:2px}
.stats b{font:400 32px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font:400 12px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.85}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none;align-items:center}
.tab{flex:none;font:700 13px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:11px 16px;border-radius:999px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab .n{opacity:.7;margin-left:6px}
.spacer{flex:1}
.ghost{flex:none;font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
main .wrap{padding-block:24px 160px;display:grid;gap:20px}
.prompt{display:grid;gap:6px;max-width:70ch}
.prompt h2{margin:0;font:800 clamp(24px,3.4vw,34px)/1.1 var(--head);text-wrap:balance}
.prompt p{margin:0;color:var(--muted)}
.hearts-left{font:700 13px/1.3 var(--mono);color:var(--muted)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;align-items:start}
.idea{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 16px 12px;display:grid;gap:12px;min-width:0;border-top:6px solid var(--tc,var(--accent))}
.idea p{margin:0;font:600 18px/1.35 var(--body);overflow-wrap:anywhere;white-space:pre-wrap}
.idea .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font:400 12px/1.3 var(--mono);color:var(--muted)}
.idea .tag{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.idea.top{box-shadow:0 0 0 3px var(--mint)}
.heart{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--mono);padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.heart[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.heart:disabled{opacity:.45;cursor:default}
.del{font:400 12px/1 var(--mono);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted);display:grid;gap:6px}
.empty b{color:var(--fg);font:800 20px/1.2 var(--head)}
form.add{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--band);color:var(--band-fg);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
form.add .wrap{padding-block:12px 0;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px;align-items:end}
form.add label{display:grid;gap:4px;font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;min-width:0}
form.add input,form.add textarea,form.add select{font:16px/1.3 var(--body);padding:11px 12px;border-radius:12px;border:0;background:#FFFDF7;color:#10202C;width:100%;min-width:0}
form.add textarea{resize:none;height:46px}
.send{font:800 16px/1 var(--head);padding:14px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;height:46px}
.status{font:400 12px/1.4 var(--mono);opacity:.85;min-height:1em;padding-top:6px}
@media (max-width:640px){form.add .wrap{grid-template-columns:1fr auto}form.add .who{grid-column:1/-1}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
html.tv .idea p{font-size:26px}html.tv .wall{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}html.tv form.add{display:none}html.tv main .wrap{padding-bottom:40px}
@media (prefers-reduced-motion:no-preference){.idea{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
.gate{position:fixed;inset:0;z-index:20;background:var(--band);color:var(--band-fg);display:grid;place-items:center;padding:24px}.gate h2{font:400 40px/1 var(--display);text-transform:uppercase;margin:0 0 8px}.gate form{display:flex;gap:8px;margin-top:16px}.gate input{font:16px var(--body);padding:12px;border-radius:12px;border:0;min-width:0;flex:1}
</style>

<div id="gate" class="gate" hidden><div><h2>Team code</h2><p>Scan the QR code in your playbook, or type the code.</p><form id="gateform"><input id="gatecode" autocomplete="off" placeholder="code"><button class="send" type="submit">Open</button></form></div></div>
<header><div class="wrap">
  <div><div class="eyebrow">Rejoes Fits · team night 12 Nov</div><h1>Ideas wall</h1></div>
  <div class="stats"><div><b id="s-ideas">0</b><span>ideas</span></div><div><b id="s-hearts">0</b><span>hearts</span></div></div>
</div></header>

<nav aria-label="Plays"><div class="wrap" role="tablist" id="tabs"></div></nav>

<main><div class="wrap">
  <div class="prompt"><h2 id="p-title"></h2><p id="p-text"></p><div class="hearts-left" id="hearts-left"></div></div>
  <div class="wall" id="wall" aria-live="polite"></div>
</div></main>

<form class="add" id="add" autocomplete="off"><div class="wrap">
  <label class="who" for="who">Your name<input id="who" maxlength="30" placeholder="e.g. Sara"></label>
  <label for="idea">Your idea<textarea id="idea" maxlength="280" placeholder="One idea, one sentence" required></textarea></label>
  <button class="send" type="submit">Post</button>
</div><div class="wrap"><div class="status" id="status"></div></div></form>

<script>
const THEMES=[
  {id:"stand",label:"1 · In store",color:"var(--t-stand)",title:"Play 1 · More yeses in the store",text:"Your best opening line. The objection you hear most and the answer that works. How you prove Fits works. What makes signing up on the spot easier."},
  {id:"bf",label:"2 · Black Friday",color:"var(--t-bf)",title:"Play 2 · Black Friday, 27 Nov to 1 Dec",text:"A bonus that costs us little and feels big. A name for the deal. How we make the deadline real. How we reach shoppers in the store, online, and the 356 accounts without a pass."},
  {id:"leden",label:"3 · Members",color:"var(--t-leden)",title:"Play 3 · Members who stay and bring a friend",text:"When does a new member think “this is great”? How do we get them there in week one? When do we ask who they’re bringing?"},
  {id:"open",label:"Open floor",color:"var(--t-open)",title:"Open floor · what did we forget to ask?",text:"Anything goes. What should we start, stop or keep? What do customers tell you? What annoys you in the store?"}
];
const HEARTS_PER_THEME=3;
const $=id=>document.getElementById(id);
let theme="stand", ideas=[], votes=[], db=null, me=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let localKey=store("fits-voter"); if(!localKey){localKey="v"+Math.random().toString(36).slice(2,10);store("fits-voter",localKey)}
$("who").value=store("fits-name")||"";
if(location.hash==="#tv")document.documentElement.classList.add("tv");
const hashTheme=THEMES.find(t=>"#"+t.id===location.hash); if(hashTheme)theme=hashTheme.id;

function renderTabs(){
  const t=$("tabs"); t.innerHTML="";
  THEMES.forEach(th=>{const b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",th.id===theme);
    b.textContent=th.label;const n=document.createElement("span");n.className="n";n.textContent=ideas.filter(i=>i.theme===th.id).length;b.append(n);
    b.onclick=()=>{theme=th.id;render()};t.append(b)});
  const sp=document.createElement("div");sp.className="spacer";t.append(sp);
  const tv=document.createElement("button");tv.className="ghost";tv.type="button";tv.id="tvbtn";
  tv.textContent=document.documentElement.classList.contains("tv")?"Phone view":"Big screen";
  tv.onclick=()=>{document.documentElement.classList.toggle("tv");render()};t.append(tv);
}
function voteCount(id){return votes.filter(v=>v.ideaId===id).length}
function myVote(id){return votes.find(v=>v.ideaId===id&&v.voter===voterId())}
function voterId(){return me||localKey}
function myHeartsIn(th){const ids=new Set(ideas.filter(i=>i.theme===th).map(i=>i.id));return votes.filter(v=>v.voter===voterId()&&ids.has(v.ideaId)).length}
function render(){
  renderTabs();
  const th=THEMES.find(t=>t.id===theme);
  $("p-title").textContent=th.title;$("p-text").textContent=th.text;
  const left=HEARTS_PER_THEME-myHeartsIn(theme);
  $("hearts-left").textContent=`You have ${left} of ${HEARTS_PER_THEME} hearts left in this play.`;
  $("s-ideas").textContent=ideas.length;$("s-hearts").textContent=votes.length;
  const list=ideas.filter(i=>i.theme===theme).map(i=>({...i,n:voteCount(i.id)})).sort((a,b)=>b.n-a.n||(a.createdAt||0)-(b.createdAt||0));
  const wall=$("wall");wall.innerHTML="";
  if(!list.length){wall.innerHTML=`<div class="empty"><b>No ideas here yet</b><span>${db?"Type your first idea below and tap Post.":"Connecting…"}</span></div>`;return}
  const topN=list[0].n>0?list.filter(x=>x.n>0).slice(0,3).map(x=>x.id):[];
  list.forEach(i=>{
    const el=document.createElement("article");el.className="idea"+(topN.includes(i.id)?" top":"");el.style.setProperty("--tc",th.color);
    const p=document.createElement("p");p.textContent=i.text;
    const meta=document.createElement("div");meta.className="meta";
    const who=document.createElement("span");who.textContent=(i.name||"Anonymous")+(topN.includes(i.id)?" · top 3":"");
    const right=document.createElement("span");right.style.display="flex";right.style.gap="6px";right.style.alignItems="center";
    if(i.author===voterId()){const d=document.createElement("button");d.className="del";d.type="button";d.textContent="Delete";d.onclick=()=>removeIdea(i.id);right.append(d)}
    const h=document.createElement("button");h.className="heart";h.type="button";const mine=!!myVote(i.id);
    h.setAttribute("aria-pressed",mine);h.setAttribute("aria-label",(mine?"Remove heart":"Give heart")+", "+i.n+" hearts");
    h.textContent="♡ "+i.n;h.disabled=!db||(!mine&&left<=0);h.onclick=()=>toggleVote(i.id);right.append(h);
    meta.append(who,right);el.append(p,meta);wall.append(el)});
}
function say(t){$("status").textContent=t}
const API="https://hwiezxqtmjwudnqdmaql.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_mVROxEEmhTrWV3OdRJAAAQ_KTCX6Muz";
const qs=new URLSearchParams(location.search);
let code=qs.get("c")||store("fits-code")||"";
async function rpc(fn,args){
  const r=await fetch(API+fn,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:code,...args})});
  const t=await r.text(); if(!r.ok){let m="";try{m=JSON.parse(t).message}catch(e){} throw new Error(m||("HTTP "+r.status))}
  return t?JSON.parse(t):null;
}
async function load(){
  try{const d=await rpc("team_wall_list",{});ideas=d.ideas;votes=d.votes;db=true;store("fits-code",code);$("gate").hidden=true;render()}
  catch(e){ if(/bad code/.test(e.message)){db=null;$("gate").hidden=false} else say("Can’t reach the wall. Check your connection.") }
}
async function toggleVote(id){
  try{await rpc("team_wall_vote",{p_idea:id,p_voter:voterId()});await load()}
  catch(e){say(/no hearts/.test(e.message)?"You used your 3 hearts in this play. Take one back first.":"Your heart didn’t go through. Try again.")}
}
async function removeIdea(id){
  try{await rpc("team_wall_delete",{p_idea:id,p_author:voterId()});await load()}catch(e){say("Couldn’t delete that.")}
}
$("add").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("idea").value.trim(), name=$("who").value.trim();
  if(!text)return;
  if(!db){say("The wall isn’t connected yet. Wait a moment and try again.");return}
  store("fits-name",name);
  try{await rpc("team_wall_add",{p_theme:theme,p_text:text,p_name:name,p_author:voterId()});$("idea").value="";say("Posted in “"+THEMES.find(t=>t.id===theme).label+"”.");await load()}
  catch(err){say(/wall full/.test(err.message)?"The wall is full.":"Couldn’t post. Try again.")}
});
$("idea").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("add").requestSubmit()}});
$("gateform").addEventListener("submit",e=>{e.preventDefault();code=$("gatecode").value.trim().toLowerCase();load()});
if(qs.has("c"))history.replaceState(null,"",location.pathname+location.hash);
render();
if(code)load();else $("gate").hidden=false;
setInterval(()=>{if(db&&!document.hidden)load()},3000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db)load()});
</script>

</body></html>
